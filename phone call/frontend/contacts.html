<body class="contacts-page-body">
  <main class="contacts-page"><header class="contacts-header"><a class="brand" href="/"><span class="brand-mark">r</span><span>relay</span></a><a class="contacts-back" href="/">← Dashboard</a></header><section class="contacts-content"><div class="panel-kicker">YOUR PEOPLE</div><h1>Contacts</h1><p class="contacts-intro">Save Gmail addresses so they are ready to call.</p><form id="contactForm" class="contact-form"><label for="contactName">Name</label><input id="contactName" type="text" placeholder="Their name" required><label for="contactEmail">Gmail address</label><input id="contactEmail" type="email" placeholder="friend@gmail.com" required><button type="submit">Save contact <span>↗</span></button></form><div class="saved-contacts-heading"><span class="panel-kicker">SAVED CONTACTS</span><span id="contactCount">0</span></div><div id="contactsList" class="contacts-list"><p class="contacts-empty">No contacts saved yet.</p></div></section></main><div class="toast" id="toast" role="status"></div><script src="contacts.js"></script>
</body>
